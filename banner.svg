<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Luis Carlos Machado Soares — Análise de Dados aplicada à Logística">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1426"/><stop offset=".55" stop-color="#070c18"/><stop offset="1" stop-color="#0d1630"/></linearGradient>
<radialGradient id="glow" cx=".82" cy=".35" r=".5"><stop offset="0" stop-color="#6fa8ff" stop-opacity=".22"/><stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ee0a0" stop-opacity=".35"/><stop offset="1" stop-color="#5ee0a0" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<clipPath id="r"><rect width="1200" height="360" rx="22"/></clipPath>
<style>
.t{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
.f{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ar{opacity:0;animation:fade 1.2s 1.8s forwards}@keyframes fade{to{opacity:1}}
.b{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.pt{opacity:0;animation:fade .4s 2.9s forwards}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 2.2s 3s ease-out infinite;opacity:0}
@keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
</style>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="360" fill="url(#bg)"/>
<rect width="1200" height="360" fill="url(#grid)"/>
<rect width="1200" height="360" fill="url(#glow)"/>
<!-- chart -->
<g transform="translate(770 70)">
<line x1="0" y1="200" x2="380" y2="200" stroke="#ffffff" stroke-opacity=".12"/>
<g fill="#6fa8ff" fill-opacity=".28">
<rect class="b" style="animation-delay:.4s" x="10" y="150" width="26" height="50" rx="4"/>
<rect class="b" style="animation-delay:.5s" x="58" y="130" width="26" height="70" rx="4"/>
<rect class="b" style="animation-delay:.6s" x="106" y="140" width="26" height="60" rx="4"/>
<rect class="b" style="animation-delay:.7s" x="154" y="110" width="26" height="90" rx="4"/>
<rect class="b" style="animation-delay:.8s" x="202" y="95" width="26" height="105" rx="4"/>
<rect class="b" style="animation-delay:.9s" x="250" y="70" width="26" height="130" rx="4"/>
<rect class="b" style="animation-delay:1s" x="298" y="55" width="26" height="145" rx="4"/>
<rect class="b" style="animation-delay:1.1s" x="346" y="30" width="26" height="170" rx="4" fill="#6fa8ff" fill-opacity=".5"/>
</g>
<path class="ar" d="M23 132 L71 118 L119 124 L167 92 L215 80 L263 52 L311 40 L359 12 L359 200 L23 200Z" fill="url(#area)"/>
<path class="ln" d="M23 132 L71 118 L119 124 L167 92 L215 80 L263 52 L311 40 L359 12" fill="none" stroke="#5ee0a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="pulse" cx="359" cy="12" r="6" fill="#5ee0a0"/>
<circle class="pt" cx="359" cy="12" r="6" fill="#5ee0a0" stroke="#070c18" stroke-width="3"/>
<g class="t pt" font-size="13" fill="#9fb0cc"><text x="0" y="226">operação</text><text x="380" y="226" text-anchor="end">decisão</text></g>
</g>
<!-- text -->
<g class="t">
<g class="f d1"><rect x="64" y="58" width="214" height="30" rx="15" fill="#5ee0a0" fill-opacity=".12" stroke="#5ee0a0" stroke-opacity=".45"/>
<circle cx="84" cy="73" r="4.5" fill="#5ee0a0"/>
<text x="98" y="78.5" font-size="13.5" font-weight="600" letter-spacing="1.6" fill="#5ee0a0">LOGÍSTICA × DADOS</text></g>
<text class="f d2" x="64" y="146" font-size="50" font-weight="700" fill="#f3f6fc" letter-spacing="-1">Luis Carlos Machado Soares</text>
<text class="f d3" x="64" y="190" font-size="24" font-weight="600" fill="#6fa8ff">Análise de Dados aplicada à Logística</text>
<text class="f d4" x="64" y="238" font-size="18" fill="#b7c3d9">+16 anos no chão da operação. Conheço o processo que gera o dado</text>
<text class="f d4" x="64" y="264" font-size="18" fill="#b7c3d9">— e transformo esse dado em indicadores e decisões.</text>
<g class="f d5" font-size="14" font-weight="600" fill="#dfe6f3">
<rect x="64" y="292" width="122" height="32" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="125" y="313" text-anchor="middle">Excel avançado</text>
<rect x="196" y="292" width="124" height="32" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="258" y="313" text-anchor="middle">Google Sheets</text>
<rect x="330" y="292" width="84" height="32" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="372" y="313" text-anchor="middle">Tableau</text>
<rect x="424" y="292" width="148" height="32" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="498" y="313" text-anchor="middle">KPIs logísticos</text>
<rect x="582" y="292" width="110" height="32" rx="8" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/><text x="637" y="313" text-anchor="middle">IA · Claude</text>
</g>
</g>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
